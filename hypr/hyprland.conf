
# #######################################################################################
# AUTOGENERATED HYPR CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hypr.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

# autogenerated = 1 # remove this line to remove the warning

# ENV
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = ELECTRON_OZONE_PLATFORM_HINT,auto

env = XIM, fcitx
env = XIM_PROGRAM, fcitx
env = QT_IM_MODULE, fcitx
env = QT_IM_MODULES, "wayland;fcitx;ibus"
env = XMODIFIERS, @im=fcitx
env = SDL_IM_MODULE, fcitx
env = GLFW_IM_MODULE, ibus # always ibus
env = INPUT_METHOD, fcitx

env = SSH_AUTH_SOCK, $XDG_RUNTIME_DIR/gcr/ssh

# zh-CN
$LANG=zh_CN.UTF-8
env = LANG,$LANG
exec-once = dbus-update-activation-environment --systemd LANG

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor = DP-1,highres,auto,1,bitdepth,10 #,transform,3
monitor = DP-2,highres,auto-center-up,1.6,bitdepth,10
monitor = HDMI-A-1,4096x2160@59.94Hz,auto,1.6,bitdepth,10

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
# exec-once = waybar & hyprpaper & firefox

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Set programs that you use

# Some default env vars.
env = XCURSOR_SIZE,24
env = HYPRLAND_LOG_WLR,1
env = HYPRLAND_NO_RT,1
env = HYPRLAND_NO_SD_NOTIFY,1
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt6ct # change to qt6ct if you have that



# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0 # -1.0 to 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 5
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10
    
    blur {
        enabled = true
        size = 3
        passes = 1
    }

    # drop_shadow = yes
    # shadow_range = 4
    # shadow_render_power = 3
    # col.shadow = rgba(1a1a1aee)
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    # new_is_master = true
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    # workspace_swipe = off
}

misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

xwayland {
    # force_zero_scaling = true
}

cursor {
    no_hardware_cursors = 2
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = logitech-mx-master-3-3
    sensitivity = 0
}

device {
    name = telink-g3m-pro
    sensitivity = -0.78
}

# Windows and Workspaces Rules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
windowrule = suppressevent maximize, class:.* # You'll probably like this.
# MATLAB
# windowrule = tile, class: ^(MATLAB [\w\d]*)$, title: ^(MATLAB [\w\d]*)$
# windowrule = nofocus, class: ^(MATLAB [\w\d]* - academic use)$, title: ^(Command HistoryWindow)$
# windowrule = noborder, class: ^(MATLAB [\w\d]* - academic use)$, title: ^(Command HistoryWindow)$
# windowrule = opacity 1.0 override, class: ^(MATLAB [\w\d]* - academic use)$, title: ^(Command HistoryWindow)$
# windowrule = nofocus, class: ^(MATLAB [\w\d]* - academic use)$, title: ^(TabCompletionPopup)$
# windowrule = noborder, class: ^(MATLAB [\w\d]* - academic use)$, title: ^(TabCompletionPopup)$
# windowrule = opacity 1.0 override, class: ^(MATLAB [\w\d]* - academic use)$, title: ^(TabCompletionPopup)$
# windowrule = nofocus, class: ^(MATLAB [\w\d]* - academic use)$, title: ^(FunctionHints)$
# windowrule = noborder, class: ^(MATLAB [\w\d]* - academic use)$, title: ^(FunctionHints)$
# windowrule = opacity 1.0 override, class: ^(MATLAB [\w\d]* - academic use)$, title: ^(FunctionHints)$
# windowrule = nofocus, class: ^(MATLAB [\w\d]* - academic use)$, title: ^(DefaultOverlayManager\.JWindow)$
# QQ
windowrule = float, class: QQ, title: 图片查看器
windowrule = float, class: QQ, title: ^(.*)(聊天记录)$
# zotero
windowrule = float, class: Zotero, title: negative:^(.*)(Zotero)$

# APPS
# exec-once = sh $HOME/.config/hypr/xdg-desktop-portal.sh
exec-once = systemctl --user start hyprpolkitagent
exec-once = dbus-update-activation-environment DISPLAY XAUTHORITY WAYLAND_DISPLAY
# exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = dunst -conf $HOME/.config/dunst/dunstrc
exec-once = waybar
# exec-once = motrix
exec-once = hyprpaper
exec-once = fcitx5 -d
exec-once = wl-paste --type text --watch cliphist store #Stores only text data
exec-once = wl-paste --type image --watch cliphist store #Stores only image data
exec-once = xwayland-satellite
exec-once = sleep 7.0; clash-verge
$HYPRCMDS_ClearAllWindows = $(hyprctl -j clients | jq -j '.[] | "dispatch closewindow address:\(.address); "')
exec-once = sleep 4.0; hyprctl --batch "$HYPRCMDS_ClearAllWindows";
                                             
# See https://wiki.hyprland.org/Configuring/ Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, K, exec, kitty
bind = $mainMod, Q, killactive
bind = $mainMod, M, exit
bind = $mainMod, D, exec, nemo
bind = $mainMod, V, togglefloating
$wofi-with-config = wofi --conf ${HOME}/.config/hypr/catppuccin_wofi/config/config --style ${HOME}/.config/hypr/catppuccin_wofi/src/macchiato/style.css
bind = $mainMod, R, exec, $wofi-with-config
bind = $mainMod, C, exec, code
bind = $mainMod, E, exec, google-chrome-stable
bind = $mainMod, F, exec, firefox
bind = $mainMod, Y, exec, kitty yazi
bind = $mainMod, Z, exec, zotero
bind = $mainMod, L, exec, swaylock -f -i ${HOME}/Pictures/wallpaper/mhw-1.jpeg; sleep 5;${HOME}/Projects/rust-scripts/screen-sleep/target/release/screen-sleep;
$screen_file = ${HOME}/Pictures/screen\ shots/screen_shot_$(date "+%Y-%m-%d-%H-%M-%S").png
bind = ALT_L, S, exec, grim -g "$(slurp)" - | tee $screen_file | wl-copy; dunstify "截图已保存和复制";
bind = ALT_L, V, exec, cliphist list | $wofi-with-config -dmenu | cliphist decode | wl-copy

bind = $mainMod+ALT, C, exec, hyprctl --batch "$HYPRCMDS_ClearAllWindows"
bind = $mainMod+ALT, P, pseudo, # dwindle
bind = $mainMod+ALT, J, togglesplit, # dwindle
bind = $mainMod+ALT, F, fullscreen
bind = $mainMod+ALT, right, workspace, e+1
bind = $mainMod+ALT, left, workspace, e-1

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, mouse_up, workspace, e+1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Control Audio
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 1%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bind = $mainMod, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bind = $mainMod, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

